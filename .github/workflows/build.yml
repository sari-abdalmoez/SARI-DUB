name: SARI-DUB Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify and prepare single APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          mapfile -t apks < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk')
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one release APK; found ${#apks[@]}"
            exit 1
          fi
          cp "${apks[0]}" output/SARI-DUB.apk
          test -s output/SARI-DUB.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SARI-DUB
          path: output/SARI-DUB.apk
          if-no-files-found: error
          retention-days: 14
