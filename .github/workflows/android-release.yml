name: Android release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create local.properties from repository secrets
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          {
            echo "TMDB_KEY=$TMDB_KEY"
            echo "TRAKT_CLIENT_ID=$TRAKT_CLIENT_ID"
            echo "GEMINI_KEY=$GEMINI_KEY"
          } > local.properties

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"; else unset KEYSTORE_FILE; fi
          gradle clean assembleRelease --no-daemon

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK"
          "$ANDROID_HOME"/build-tools/*/aapt dump badging "$APK" | grep "package: name='com.saridub.app'"

      - uses: actions/upload-artifact@v4
        with:
          name: SariDub-release-apk
          path: app/build/outputs/apk/release/app-release.apk
