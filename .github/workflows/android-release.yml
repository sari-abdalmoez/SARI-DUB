name: SARI-DUB Manual Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TMDB_KEY: ${{ secrets.TMDB_KEY }}
      TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
      GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Validate required API secrets
        shell: bash
        run: |
          set -euo pipefail
          for key in TMDB_KEY TRAKT_CLIENT_ID GEMINI_KEY; do
            if [ -z "${!key:-}" ]; then
              echo "::warning::GitHub Actions secret $key is missing. The APK can build, but the related provider will not authenticate. Add it in Settings > Secrets and variables > Actions. No secret value is printed."
            fi
          done
      - name: Create local.properties
        shell: bash
        run: |
          printf 'TMDB_KEY=%s\n' "$TMDB_KEY" > local.properties
          printf 'TRAKT_CLIENT_ID=%s\n' "$TRAKT_CLIENT_ID" >> local.properties
          printf 'GEMINI_KEY=%s\n' "$GEMINI_KEY" >> local.properties
      - name: Build release APK
        run: gradle --no-daemon clean assembleRelease
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.saridub.app'"
      - uses: actions/upload-artifact@v4
        with:
          name: SARI-DUB-Release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
