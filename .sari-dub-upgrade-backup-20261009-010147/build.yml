name: Build SARI DUB

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  native-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: DSP unit tests (host, ASan+UBSan)
        run: |
          g++ -std=c++17 -O2 -Wall -fsanitize=address,undefined \
            native_tests/dsp_test.cpp app/src/main/cpp/dsp.cpp -o dsp_test
          ./dsp_test

  build:
    runs-on: ubuntu-22.04
    needs: native-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK, build-tools, NDK, CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" \
            "ndk;26.1.10909125" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Locate and verify the single APK
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk')
          echo "Found: ${APKS[*]}"
          [ "${#APKS[@]}" -eq 1 ] || { echo "Expected exactly one APK"; exit 1; }
          cp "${APKS[0]}" SARI-DUB.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose SARI-DUB.apk
          unzip -l SARI-DUB.apk | grep -E "lib/arm64-v8a/libsaridub.so"
          unzip -l SARI-DUB.apk | grep -E "lib/armeabi-v7a/libsaridub.so"
          ls -l SARI-DUB.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SARI-DUB.apk
          path: SARI-DUB.apk
          if-no-files-found: error
