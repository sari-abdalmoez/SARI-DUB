name: Build SARI DUB

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  GRADLE_VERSION: "8.7"
  ANDROID_PLATFORM: "android-34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_NDK: "26.1.10909125"
  CMAKE_VERSION: "3.22.1"

jobs:
  native-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: DSP unit tests (host, ASan+UBSan)
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -fsanitize=address,undefined \
            native_tests/dsp_test.cpp app/src/main/cpp/dsp.cpp -o dsp_test
          ./dsp_test

  build:
    runs-on: ubuntu-22.04
    needs: native-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME" || { echo "ERROR: Android SDK not found at $ANDROID_HOME"; exit 1; }

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          fi

          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || {
            echo "ERROR: sdkmanager was not found"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          }

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          echo "SDKMANAGER=$SDKMANAGER"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platforms;$ANDROID_PLATFORM" \
            "build-tools;$ANDROID_BUILD_TOOLS" \
            "ndk;$ANDROID_NDK" \
            "cmake;$CMAKE_VERSION"

          "$SDKMANAGER" --list_installed | grep -E \
            "platforms;$ANDROID_PLATFORM|build-tools;$ANDROID_BUILD_TOOLS|ndk;$ANDROID_NDK|cmake;$CMAKE_VERSION"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Verify Android and Gradle toolchain
        run: |
          set -euo pipefail
          java -version
          gradle --version
          command -v sdkmanager
          test -d "$ANDROID_HOME/platforms/$ANDROID_PLATFORM"
          test -d "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          test -d "$ANDROID_HOME/ndk/$ANDROID_NDK"
          test -d "$ANDROID_HOME/cmake/$CMAKE_VERSION"

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Locate and verify the single APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print)
          echo "Found APKs:"
          printf '%s\n' "${APKS[@]}"
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one release APK."
            exit 1
          fi
          cp "${APKS[0]}" SARI-DUB.apk
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify --verbose SARI-DUB.apk
          if ! unzip -l SARI-DUB.apk | grep -E 'lib/(arm64-v8a|armeabi-v7a)/libsaridub.so' >/dev/null; then
            echo "ERROR: native SARI DUB library missing from APK"
            exit 1
          fi
          ls -lh SARI-DUB.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SARI-DUB.apk
          path: SARI-DUB.apk
          if-no-files-found: error
